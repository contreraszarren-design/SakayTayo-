  <main class="auth-wrapper">
    <div class="brand-header">
      <a href="sakaytayolandingpage.html" class="brand-title">
        <span class="brand-sakay">Sakay</span><span class="brand-tayo">Tayo!</span>
      </a>
      <p class="brand-tagline">commuting made easier</p>
    </div>

    <section class="auth-card">
      <h1 class="card-heading">BE A DRIVER</h1>

      <form id="signup-form" data-role="driver" novalidate>
        <div class="form-group">
          <label for="fullName">FULL NAME</label>
          <input type="text" id="fullName" name="fullName" required />
        </div>

        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="contactNumber">CONTACT NUMBER</label>
          <input type="tel" id="contactNumber" name="contactNumber" required />
        </div>

        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" required />
        </div>

        <div class="form-actions">
          <a href="sakaytayolandingpage.html" class="back-link">← Back</a>
          <button type="submit" class="submit-btn">SIGN UP</button>
        </div>
      </form>
    </section>
  </main>

  <div id="auth-toast" class="toast" role="status" aria-live="polite"></div>
