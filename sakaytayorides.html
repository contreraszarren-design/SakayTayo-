<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SakayTayo! — Rides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="sakaytayorides.css" />
  <script>
    // Rider-only gate: runs before the page is shown.
    (function () {
      var u = {};
      try { u = JSON.parse(localStorage.getItem("sakaytayo_user") || "{}"); } catch (e) {}
      if (u.role === "driver" && u.verificationStatus) { location.replace("sakaytayodriverdash.html"); }
      else if (u.role !== "passenger") { location.replace("sakaytayolandingpage.html"); }
      else if (!u.accountStatus) { location.replace("passengeraccount.html"); }
    })();
  </script>
</head>
<body>
  <div class="bg-scene" aria-hidden="true"></div>

  <header class="navbar">
    <a href="sakaytayolandingpage.html" class="brand-logo"><span class="brand-sakay">Sakay</span><span class="brand-tayo">Tayo!</span></a>
    <nav class="nav-links" aria-label="Primary Navigation">
      <a href="sakaytayolandingpage.html" class="nav-item">Home</a>
      <button class="nav-item tab-btn active" data-tab="find">Find a Ride</button>
      <button class="nav-item tab-btn" data-tab="seats">Seat Manager</button>
      <button class="nav-item tab-btn" data-tab="history">My Rides</button>
      <button class="nav-item" id="logout">Log out</button>
    </nav>
  </header>

  <main class="rides-wrapper">
    <!-- 1 + 2: Carpool Matching and Ride Reservation -->
    <section class="panel active" id="tab-find">
      <div class="glass-card">
        <h1 class="card-heading">FIND A RIDE</h1>
        <p class="card-subtitle">We match you with classmates going your way, sorted by best fit.</p>
        <form id="search-form" class="search-grid">
          <div class="form-group"><label for="fromInput">Pick-up point</label><input id="fromInput" list="places" placeholder="e.g. San Jose Town Proper" /></div>
          <div class="form-group"><label for="toInput">Destination</label><input id="toInput" list="places" placeholder="e.g. BatStateU Alangilan" /></div>
          <div class="form-group"><label for="dateInput">Date</label><input id="dateInput" type="date" /></div>
          <div class="form-group"><label for="timeInput">Preferred time</label><input id="timeInput" type="time" /></div>
          <button type="submit" class="pill-btn primary-btn span-2">Find matching rides</button>
        </form>
        <datalist id="places"></datalist>
      </div>
      <div id="match-list" class="ride-list"></div>
    </section>

    <!-- 3: Available Seat Management -->
    <section class="panel" id="tab-seats">
      <div class="glass-card">
        <h1 class="card-heading">SEAT MANAGER</h1>
        <p class="card-subtitle">Open seats update automatically when passengers reserve or cancel.</p>
        <div id="seat-list" class="seat-list"></div>
      </div>
    </section>

    <!-- 4: Ride History -->
    <section class="panel" id="tab-history">
      <div class="glass-card">
        <h1 class="card-heading">MY RIDES</h1>
        <p class="card-subtitle">Your upcoming and previous carpool reservations.</p>
        <div class="segmented" role="tablist">
          <button class="seg-btn active" data-seg="upcoming">Upcoming</button>
          <button class="seg-btn" data-seg="past">Past</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="sakaytayodata.js"></script>
  <script src="sakaytayorides.js"></script>
</body>
</html>
